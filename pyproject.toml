[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csc311-music-recommender"
version = "0.1.0"
description = "Hybrid implicit-feedback and content-based music recommendation experiments"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

