[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csc311-music-recommender"
version = "0.1.0"
description = "Hybrid implicit-feedback and content-based music recommendation experiments"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.4,<2",
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "pyarrow>=18,<22",
    "scipy>=1.14,<2",
    "scikit-learn>=1.6,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
